<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пятёрочка — SAP 300R</title>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #f4f6f8;
        color: #20252b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 22px 60px;
    }
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }
    .brand {
        font-weight: 800;
        font-size: 20px;
        text-decoration: none;
        color: #20252b;
    }
    .nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .nav a, .button {
        display: inline-block;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 10px;
        border: 1px solid #d9dfe5;
        background: white;
        color: #20252b;
        font-size: 14px;
        font-weight: 700;
    }
    .nav a.active {
        background: #20252b;
        color: white;
        border-color: #20252b;
    }
    .hero, section {
        background: white;
        border-radius: 18px;
        padding: 28px 30px;
        box-shadow: 0 4px 18px rgba(0,0,0,.07);
        margin-bottom: 22px;
    }
    h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }
    h2 {
        margin: 0 0 6px;
        font-size: 23px;
    }
    .subtitle, .section-note {
        color: #6b7280;
        font-size: 14px;
    }
    .subtitle { margin-bottom: 24px; }
    .section-note { margin: 0 0 18px; }
    .store-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
    }
    .card {
        background: #f8fafc;
        border: 1px solid #e7ebef;
        border-radius: 12px;
        padding: 15px 16px;
    }
    .label {
        color: #7a828b;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
        margin-bottom: 5px;
    }
    .value {
        font-size: 16px;
        font-weight: 600;
    }
    .stats {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
    }
    .stat {
        background: #eef2f6;
        border-radius: 999px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 600;
    }
    .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
    }
    .action-card {
        display: block;
        text-decoration: none;
        color: #20252b;
        background: #f8fafc;
        border: 1px solid #e2e7ec;
        border-radius: 14px;
        padding: 20px;
    }
    .action-card strong {
        display: block;
        font-size: 20px;
        margin-bottom: 6px;
    }
    .action-card span {
        color: #69727c;
        font-size: 14px;
    }
    .table-wrap {
        overflow-x: auto;
        border: 1px solid #e5e9ed;
        border-radius: 12px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        background: white;
    }
    th {
        position: sticky;
        top: 0;
        background: #f4f6f8;
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid #dce1e6;
        white-space: nowrap;
    }
    td {
        padding: 10px 12px;
        border-bottom: 1px solid #eef1f3;
        vertical-align: top;
    }
    tbody tr:hover { background: #fafbfc; }
    .offer-price { font-weight: 700; color: #08783e; }
    .discount { font-weight: 700; }
    .footer {
        text-align: center;
        color: #8a929a;
        font-size: 12px;
        margin-top: 28px;
    }
    @media (max-width: 760px) {
        .store-grid, .actions { grid-template-columns: 1fr; }
        .page { padding: 16px 10px 40px; }
        .hero, section { border-radius: 12px; padding: 18px; }
    }
    @media print {
        body { background: white; }
        .page { max-width: none; padding: 0; }
        .hero, section { box-shadow: none; border: 1px solid #ddd; }
        th { position: static; }
        .nav { display: none; }
    }
</style>

</head>
<body>
<div class="page">
    
<div class="topbar">
    <a class="brand" href="report_300R.html">Пятёрочка — SAP 300R</a>
    <div class="nav">
        <a href="catalog_300R.html">Каталог товаров</a>
        <a href="offers_300R.html">Предложения магазина</a>
    </div>
</div>

    <div class="hero">
        <h1>Пятёрочка — SAP 300R</h1>
        <div class="subtitle">Данные конкретного магазина</div>

        <div class="store-grid">
            <div class="card">
                <div class="label">Адрес</div>
                <div class="value">Москва г, Сосенское п, 206 кв-л,300, с.1</div>
            </div>
            <div class="card">
                <div class="label">Режим работы</div>
                <div class="value">00:15–23:45</div>
            </div>
            <div class="card">
                <div class="label">Статус</div>
                <div class="value">active</div>
            </div>
        </div>

        <div class="actions">
            <a class="action-card" href="catalog_300R.html">
                <strong>Каталог товаров</strong>
                <span>4,371 позиций</span>
            </a>
            <a class="action-card" href="offers_300R.html">
                <strong>Предложения магазина</strong>
                <span>1,351 позиций</span>
            </a>
        </div>
    </div>
    <div class="footer">Данные магазина Пятёрочка SAP 300R.</div>
</div>
</body>
</html>
